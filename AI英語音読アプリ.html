<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI英語音読＆スピーキングトレーナー (seitono Voice AI Pro)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone for JSX compilation in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .font-serif-custom { font-family: 'Newsreader', Georgia, serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

<div id="root"></div>

<script type="text/babel">
  const { useState, useEffect, useRef } = React;

  const Icon = ({ path, className = "w-5 h-5", fill = "none" }) => (
    <svg className={className} fill={fill} viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      {path}
    </svg>
  );

  const Icons = {
    BookOpen: (p) => <Icon {...p} path={<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />} />,
    Mic: (p) => <Icon {...p} path={<g><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></g>} />,
    Volume2: (p) => <Icon {...p} path={<g><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></g>} />,
    CheckCircle: (p) => <Icon {...p} path={<g><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></g>} />,
    Send: (p) => <Icon {...p} path={<g><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></g>} />,
    Key: (p) => <Icon {...p} path={<g><path d="M21 2l-2 2m-1.5 1.5l-3 3m-2 2l-3 3m-2 2l-3 3"/><circle cx="7.5" cy="16.5" r="4.5"/></g>} />,
    ExternalLink: (p) => <Icon {...p} path={<g><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></g>} />,
    Award: (p) => <Icon {...p} path={<g><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></g>} />,
    Sparkles: (p) => <Icon {...p} path={<path d="M12 3l1.912 5.813a2 2 0 001.275 1.275L21 12l-5.813 1.912a2 2 0 00-1.275 1.275L12 21l-1.912-5.813a2 2 0 00-1.275-1.275L3 12l5.813-1.912a2 2 0 001.275-1.275L12 3z"/>} />,
    User: (p) => <Icon {...p} path={<g><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></g>} />,
    GraduationCap: (p) => <Icon {...p} path={<g><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></g>} />,
    HelpCircle: (p) => <Icon {...p} path={<g><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></g>} />,
    ChevronRight: (p) => <Icon {...p} path={<polyline points="9 18 15 12 9 6"/>} />,
    Zap: (p) => <Icon {...p} path={<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>} />,
    X: (p) => <Icon {...p} path={<g><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></g>} />,
    Languages: (p) => <Icon {...p} path={<g><path d="m5 8 6 6"/><path d="m4 14 6-6 2 3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></g>} />,
    AlertCircle: (p) => <Icon {...p} path={<g><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></g>} />,
    Eye: (p) => <Icon {...p} path={<g><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></g>} />
  };

  const PRESET_PASSAGES = [
    {
      id: 'passage-1',
      title: 'AI and the Future of Renewable Energy',
      level: 'CEFR B2 / 英検2級',
      category: 'Technology & Climate',
      passage: `Artificial intelligence is transforming how we store and distribute renewable energy. Smart grids powered by machine learning algorithms can predict energy demand with unprecedented accuracy, allowing solar and wind power systems to operate at maximum efficiency. As climate change accelerates, these technological innovations become crucial for a sustainable transition.`,
      translation: `人工知能（AI）は、再生可能エネルギーの蓄電と分配の方法に変革をもたらしています。機械学習アルゴリズムを活用したスマートグリッドは、これまでにない精度でエネルギー需要を予測でき、太陽光発電や風力発電システムを最大効率で運用できるようにします。気候変動が加速する中、これらの技術革新は持続可能な社会への移行にとって極めて重要です。`,
      vocabulary: [
        { word: 'unprecedented', meaning: '前例のない・かつてない' },
        { word: 'accelerates', meaning: '加速する・促進される' },
        { word: 'crucial', meaning: 'きわめて重要な・決定的な' },
        { word: 'sustainable', meaning: '持続可能な' }
      ],
      quizzes: [
        {
          question: 'What technology helps predict energy demand in smart grids?',
          options: ['Fossil fuel generators', 'Machine learning algorithms', 'Manual power switches', 'Hydroelectric dams'],
          correctIndex: 1,
          explanation: '第2文「Smart grids powered by machine learning algorithms can predict energy demand...」に、機械学習アルゴリズム（Machine learning algorithms）が需要を予測すると記載されています。'
        },
        {
          question: 'Why are these innovations becoming crucial?',
          options: [
            'Because traditional energy is free',
            'Because climate change is accelerating',
            'To decrease computer usage',
            'To replace wind turbines with coal'
          ],
          correctIndex: 1,
          explanation: '第3文「As climate change accelerates, these technological innovations become crucial...」より、気候変動が加速しているため技術革新が重要になっていることが分かります。'
        }
      ]
    },
    {
      id: 'passage-2',
      title: 'The Psychological Power of Habit Loops',
      level: 'CEFR B2 / 英検準1級',
      category: 'Psychology & Health',
      passage: `Building positive habits is fundamental to achieving long-term personal goals. Psychological research shows that habits follow a three-step loop: a cue, a routine, and a reward. By understanding this process, individuals can consciously reshape their behaviors and overcome procrastination.`,
      translation: `良い習慣を身につけることは、長期的な個人の目標を達成するための基本です。心理学の研究によると、習慣は「きっかけ（cue）」「行動（routine）」「報酬（reward）」の3つのステップのループに従っています。このプロセスを理解することで、人は意識的に行動を再構築し、先延ばし癖を克服することができます。`,
      vocabulary: [
        { word: 'fundamental', meaning: '根本的な・不可欠な' },
        { word: 'consciously', meaning: '意識的に' },
        { word: 'procrastination', meaning: '先延ばし癖' }
      ],
      quizzes: [
        {
          question: 'According to the text, what three steps make up a habit loop?',
          options: ['Start, middle, and end', 'Cue, routine, and reward', 'Plan, action, and mistake', 'Thought, feeling, and dream'],
          correctIndex: 1,
          explanation: '第2文「habits follow a three-step loop: a cue, a routine, and a reward.」と明記されています。'
        }
      ]
    }
  ];

  function App() {
    const [mode, setMode] = useState('student');
    const [activeTab, setActiveTab] = useState('reading');
    const [apiKey, setApiKey] = useState('');
    const [showSettings, setShowSettings] = useState(false);
    const [tasks, setTasks] = useState(PRESET_PASSAGES);
    const [selectedTask, setSelectedTask] = useState(PRESET_PASSAGES[0]);

    const [showTranslation, setShowTranslation] = useState(false);

    const [activeStep, setActiveStep] = useState(1);
    const [quizAnswers, setQuizAnswers] = useState({});
    const [quizSubmitted, setQuizSubmitted] = useState(false);
    const [practiceCount, setPracticeCount] = useState(0);

    const [isRecording, setIsRecording] = useState(false);
    const [transcript, setTranscript] = useState('');
    const [isPlayingModelVoice, setIsPlayingModelVoice] = useState(false);

    const [assessmentResult, setAssessmentResult] = useState(null);
    const [wordAnalysis, setWordAnalysis] = useState([]); // 文字認識・発音分析データ
    const [isEvaluating, setIsEvaluating] = useState(false);
    const [submittedToClassroom, setSubmittedToClassroom] = useState(false);

    const [toastMessage, setToastMessage] = useState(null);

    const [teacherPassage, setTeacherPassage] = useState('');
    const [teacherTitle, setTeacherTitle] = useState('');
    const [teacherCategory, setTeacherCategory] = useState('General');
    const [isGenerating, setIsGenerating] = useState(false);

    const recognitionRef = useRef(null);

    const showToast = (msg) => {
      setToastMessage(msg);
      setTimeout(() => setToastMessage(null), 3500);
    };

    useEffect(() => {
      const savedKey = localStorage.getItem('seitono_gemini_api_key');
      if (savedKey) setApiKey(savedKey);

      if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognitionRef.current = new SpeechRecognition();
        recognitionRef.current.continuous = true;
        recognitionRef.current.interimResults = true;
        recognitionRef.current.lang = 'en-US';

        recognitionRef.current.onresult = (event) => {
          let currentTranscript = '';
          for (let i = 0; i < event.results.length; i++) {
            currentTranscript += event.results[i][0].transcript;
          }
          setTranscript(currentTranscript);
        };

        recognitionRef.current.onerror = (event) => {
          console.error('Speech recognition error:', event.error);
          setIsRecording(false);
        };

        recognitionRef.current.onend = () => {
          setIsRecording(false);
        };
      }
    }, []);

    const saveApiKey = (key) => {
      setApiKey(key);
      localStorage.setItem('seitono_gemini_api_key', key);
      setShowSettings(false);
      showToast('Gemini APIキーを正常に保存しました！');
    };

    const speakText = (text) => {
      if (!('speechSynthesis' in window)) {
        showToast('お使いのブラウザは音声再生に対応していません。');
        return;
      }

      if (isPlayingModelVoice) {
        window.speechSynthesis.cancel();
        setIsPlayingModelVoice(false);
        return;
      }

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.9;

      utterance.onend = () => setIsPlayingModelVoice(false);
      utterance.onerror = () => setIsPlayingModelVoice(false);

      setIsPlayingModelVoice(true);
      window.speechSynthesis.speak(utterance);
    };

    const toggleRecording = (isPractice = false) => {
      if (!recognitionRef.current) {
        showToast('Google ChromeやEdgeなどの音声認識対応ブラウザでお試しください。');
        return;
      }

      if (isRecording) {
        recognitionRef.current.stop();
        setIsRecording(false);
        if (isPractice) {
          setPracticeCount((prev) => prev + 1);
        }
      } else {
        setTranscript('');
        try {
          recognitionRef.current.start();
          setIsRecording(true);
        } catch (err) {
          console.error("Recording start error:", err);
        }
      }
    };

    // 音声を原文と単語単位で比較・分析する関数（文字認識ビジュアル化）
    const analyzeSpeechWithText = (readTranscript, passageText) => {
      const cleanWord = (w) => w.toLowerCase().replace(/[^a-z0-9]/g, '');
      const originalWords = passageText.split(/\s+/);
      const recognizedWords = readTranscript.split(/\s+/).map(cleanWord).filter(Boolean);

      const wordMap = originalWords.map((orig) => {
        const cleaned = cleanWord(orig);
        if (!cleaned) return { raw: orig, matched: true };
        
        // 認識された単語リストに含まれているか判定
        const isMatched = recognizedWords.includes(cleaned);
        return {
          raw: orig,
          clean: cleaned,
          matched: isMatched
        };
      });

      return wordMap;
    };

    const evaluateReading = async () => {
      if (!transcript.trim()) {
        showToast('まずは録音を行ってください。');
        return;
      }

      setIsEvaluating(true);

      // 単語ごとの文字認識・マッチングを実行
      const wordAnalysisData = analyzeSpeechWithText(transcript, selectedTask.passage);
      setWordAnalysis(wordAnalysisData);

      if (apiKey) {
        try {
          const prompt = `Act as an expert English speech and pronunciation evaluator for Japanese students.
Target Passage: "${selectedTask.passage}"
Student Speech Transcript: "${transcript}"

Analyze the speech carefully for accuracy, fluency, and pronunciation details.
Identify specific words that were mispronounced, skipped, or had accent issues.
Provide detailed advice on mouth shapes, accents, or phonetics for Japanese learners.

Return ONLY a valid JSON object matching this schema (no markdown fences):
{
  "score": 88,
  "cefrLevel": "B2",
  "accuracy": 90,
  "fluency": 85,
  "feedback": "非常にクリアで自然なリズムです。特定語彙のアクセントを直すとさらに良くなります。",
  "missedWords": [
    {
      "word": "unprecedented",
      "phonetic": "/ʌnˈprɛs.ɪ.dən.tɪd/",
      "advice": "第2シラブルの pre に強いアクセントを置きます。"
    },
    {
      "word": "accelerates",
      "phonetic": "/ækˈsɛl.ə.reɪts/",
      "advice": "最初の c は 'k' 音、2つ目の c は 's' 音でクリアに区別しましょう。"
    }
  ],
  "detailedAdvice": "文節（チャンク）ごとのつながりを意識し、カンマの位置で少し息を整えると流暢さが一層増します。"
}`;

          const response = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`,
            {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            }
          );

          const data = await response.json();
          const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
          const jsonMatch = rawText.match(/\{[\s\S]*\}/);

          if (jsonMatch) {
            setAssessmentResult(JSON.parse(jsonMatch[0]));
          } else {
            throw new Error('Invalid JSON format');
          }
        } catch (err) {
          console.error('Gemini API Error', err);
          performFallbackEvaluation(wordAnalysisData);
        }
      } else {
        setTimeout(() => performFallbackEvaluation(wordAnalysisData), 800);
      }

      setIsEvaluating(false);
      setActiveStep(4);
    };

    const performFallbackEvaluation = (wordAnalysisData) => {
      const totalWords = wordAnalysisData.length;
      const matchedCount = wordAnalysisData.filter(w => w.matched).length;
      const accuracyScore = Math.min(100, Math.round((matchedCount / Math.max(totalWords, 1)) * 100));
      const totalScore = Math.min(100, Math.round(accuracyScore * 0.85 + 15));

      const unMatchedWords = wordAnalysisData.filter(w => !w.matched && w.clean && w.clean.length > 3);
      const missedList = unMatchedWords.slice(0, 3).map(w => ({
        word: w.clean,
        phonetic: '要確認',
        advice: `「${w.clean}」が発音不鮮明または読み飛ばされた可能性があります。母音とアクセントを意識してみましょう。`
      }));

      setAssessmentResult({
        score: totalScore,
        cefrLevel: totalScore > 85 ? 'B2 / 英検2級' : 'B1 / 英検準2級',
        accuracy: accuracyScore,
        fluency: 84,
        feedback: '全体的にハッキリ発音できています！文字認識で赤く表示された単語を中心に再確認しましょう。',
        missedWords: missedList,
        detailedAdvice: '英語独特の強弱アクセントと連結音（リンキング）を意識して、もう一度お手本音声を聞いてシャドーイングしてみましょう。'
      });
    };

    const handleTeacherGenerate = async () => {
      if (!teacherPassage.trim()) {
        showToast('英文テキストを入力してください。');
        return;
      }

      setIsGenerating(true);

      if (apiKey) {
        try {
          const prompt = `Create an English reading comprehension task from this passage:
"${teacherPassage}"

Include a natural Japanese translation and detailed quiz explanations.
Return ONLY a valid JSON object matching this schema:
{
  "title": "${teacherTitle || 'Custom Task'}",
  "level": "CEFR B2 / 英検2級",
  "category": "${teacherCategory}",
  "passage": "${teacherPassage.replace(/"/g, '\\"')}",
  "translation": "ここに日本語訳",
  "vocabulary": [{"word": "word1", "meaning": "意味1"}],
  "quizzes": [
    {
      "question": "Question?",
      "options": ["A", "B", "C", "D"],
      "correctIndex": 0,
      "explanation": "日本語での正解の根拠解説"
    }
  ]
}`;

          const response = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`,
            {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            }
          );

          const data = await response.json();
          const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
          const jsonMatch = rawText.match(/\{[\s\S]*\}/);

          if (jsonMatch) {
            const newTask = { ...JSON.parse(jsonMatch[0]), id: `task-${Date.now()}` };
            setTasks([newTask, ...tasks]);
            setSelectedTask(newTask);
            showToast('AI課題が正常に自動作成されました！');
          } else {
            throw new Error('JSON Parse failed');
          }
        } catch (err) {
          console.error(err);
          createDemoTask();
        }
      } else {
        setTimeout(() => {
          createDemoTask();
          showToast('（デモ）新課題が作成・追加されました！');
        }, 800);
      }

      setIsGenerating(false);
    };

    const createDemoTask = () => {
      const newTask = {
        id: `task-${Date.now()}`,
        title: teacherTitle || 'Custom Reading Task',
        level: 'CEFR B2 / 英検2級',
        category: teacherCategory,
        passage: teacherPassage,
        translation: '（自動作成された課題の日本語訳です）',
        vocabulary: [
          { word: 'innovation', meaning: '革新・技術革新' },
          { word: 'sustainability', meaning: '持続可能性' }
        ],
        quizzes: [
          {
            question: 'What is the main topic of this passage?',
            options: ['Technology & Innovation', 'Ancient history', 'Cooking skills', 'Sports rules'],
            correctIndex: 0,
            explanation: '本文の主題であるテクノロジーと技術革新について記述されています。'
          }
        ]
      };
      setTasks([newTask, ...tasks]);
      setSelectedTask(newTask);
    };

    return (
      <div className="min-h-screen bg-slate-50 text-slate-800 pb-16">
        {/* Toast Notification */}
        {toastMessage && (
          <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-2xl border border-slate-700 text-xs font-bold animate-bounce flex items-center gap-2">
            <Icons.Sparkles className="w-4 h-4 text-amber-400" />
            {toastMessage}
          </div>
        )}

        {/* Header */}
        <header className="bg-gradient-to-r from-indigo-800 via-indigo-700 to-indigo-900 text-white shadow-lg sticky top-0 z-40 border-b border-indigo-600/30">
          <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
            <div className="flex items-center space-x-3">
              <div className="bg-white/10 p-2 rounded-2xl backdrop-blur-md border border-white/20">
                <Icons.GraduationCap className="w-7 h-7 text-indigo-200" />
              </div>
              <div>
                <h1 className="text-xl font-extrabold tracking-tight flex items-center gap-2">
                  seitono <span className="text-xs bg-indigo-500/80 px-2.5 py-0.5 rounded-full font-semibold border border-indigo-300/30">Voice AI Pro</span>
                </h1>
                <p className="text-[11px] text-indigo-200">AI英語音読・発音文字認識＆理解統合学習Webアプリ</p>
              </div>
            </div>

            <div className="flex items-center space-x-3">
              <div className="bg-indigo-950/60 p-1 rounded-xl flex items-center border border-indigo-500/30">
                <button
                  onClick={() => setMode('student')}
                  className={`px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 ${
                    mode === 'student' ? 'bg-white text-indigo-900 shadow-sm' : 'text-indigo-200 hover:text-white'
                  }`}
                >
                  <Icons.User className="w-3.5 h-3.5" /> 生徒モード
                </button>
                <button
                  onClick={() => setMode('teacher')}
                  className={`px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 ${
                    mode === 'teacher' ? 'bg-white text-indigo-900 shadow-sm' : 'text-indigo-200 hover:text-white'
                  }`}
                >
                  <Icons.BookOpen className="w-3.5 h-3.5" /> 先生モード
                </button>
              </div>

              <button
                onClick={() => setShowSettings(true)}
                className="p-2 bg-indigo-600 hover:bg-indigo-500 rounded-xl transition border border-indigo-400/30 flex items-center gap-1.5 text-xs font-semibold shadow-sm"
              >
                <Icons.Key className="w-4 h-4 text-amber-300" />

                        <div className="flex items-center justify-between">
                          <h4 className="text-xs font-bold text-slate-800 flex items-center gap-2">
                            <Icons.Eye className="w-4 h-4 text-indigo-600" /> 音声認識・発音ヒートマップ（文字認識結果）
                          </h4>
                          <div className="flex items-center gap-3 text-[11px]">
                            <span className="flex items-center gap-1 font-bold text-emerald-700">
                              <span className="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> 発音OK
                            </span>
                            <span className="flex items-center gap-1 font-bold text-rose-600">
                              <span className="w-2.5 h-2.5 rounded-full bg-rose-500"></span> 発音注意 / 読み飛ばし
                            </span>
                          </div>
                        </div>

                        <div className="p-4 bg-white rounded-xl border border-slate-200 font-serif-custom leading-relaxed text-sm md:text-base flex flex-wrap gap-x-1.5 gap-y-1">
                          {wordAnalysis.map((item, idx) => (
                            <span
                              key={idx}
                              className={`px-1 py-0.5 rounded transition ${
                                item.matched
                                  ? 'bg-emerald-50 text-emerald-900 font-medium'
                                  : 'bg-rose-100 text-rose-900 font-bold underline decoration-rose-500 underline-offset-4'
                              }`}
                            >
                              {item.raw}
                            </span>
                          ))}
                        </div>
                      </div>
                    )}

                    {/* ③ 発音に注意が必要な単語＆アドバイス */}
                    {assessmentResult.missedWords && assessmentResult.missedWords.length > 0 && (
                      <div className="p-5 bg-rose-50/70 rounded-2xl border border-rose-100 space-y-3">
                        <h4 className="text-xs font-bold text-rose-900 flex items-center gap-2">
                          <Icons.AlertCircle className="w-4 h-4 text-rose-600" /> 発音に注意が必要な単語リスト
                        </h4>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                          {assessmentResult.missedWords.map((item, idx) => (
                            <div key={idx} className="p-3 bg-white rounded-xl border border-rose-200 text-xs shadow-xs space-y-1">
                              <div className="flex items-center justify-between">
                                <span className="font-bold text-rose-900 text-sm">{item.word}</span>
                                {item.phonetic && (
                                  <span className="text-[11px] font-mono bg-slate-100 text-slate-600 px-2 py-0.5 rounded">
                                    {item.phonetic}
                                  </span>
                                )}
                              </div>
                              <p className="text-slate-600 text-[11px] leading-relaxed">{item.advice}</p>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}

                    {/* 総合フィードバック */}
                    <div className="p-5 bg-indigo-50/70 rounded-2xl border border-indigo-100 space-y-2">
                      <h4 className="text-xs font-bold text-indigo-900 flex items-center gap-2">
                        <Icons.Sparkles className="w-4 h-4 text-indigo-600" /> AIからの指導アドバイス
                      </h4>
                      <p className="text-xs text-slate-700 leading-relaxed font-medium">{assessmentResult.feedback}</p>
                      {assessmentResult.detailedAdvice && (
                        <p className="text-xs text-indigo-900 leading-relaxed pt-2 border-t border-indigo-200/60 font-semibold">
                          💡 改善アドバイス: {assessmentResult.detailedAdvice}
                        </p>
                      )}
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}
        </main>
      </div>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
</script>
</body>
</html>
